[package]
name = "eighty-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eighty-hw = { path = "../eighty-hw" }
serde.workspace = true
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
anyhow = "1"

[dev-dependencies]
eighty-hw = { path = "../eighty-hw", features = ["fake"] }
