[package]
name = "eighty-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "eighty_cli"

[[bin]]
name = "eighty"
path = "src/main.rs"

[dependencies]
eighty-core = { path = "../eighty-core" }
thiserror.workspace = true
eighty-hw = { path = "../eighty-hw" }
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
